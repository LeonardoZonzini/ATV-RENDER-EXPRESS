<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar - CRUD CPF</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>CRUD - Protocolo HTTP (Busca por CPF)</h1>
        <nav>
            <a href="/">Início</a>
            <a href="/post/post.html">Cadastrar</a>
            <a href="/get/get.html">Listar</a>
            <a href="/put/put.html">Atualizar</a>
            <a href="/delete/delete.html">Excluir</a>
        </nav>
    </header>
    <main>
        <h2>Cadastrar pessoa (POST)</h2>
        <form id="formCadastro">
            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required>
            </div>
            <div class="campo">
                <label for="sobrenome">Sobrenome:</label>
                <input type="text" id="sobrenome" required>
            </div>
            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" required>
            </div>
            <div class="campo">
                <label for="idade">Idade:</label>
                <input type="number" id="idade" required>
            </div>
            <div class="campo">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" required>
            </div>
            <div class="campo">
                <label for="rg">RG:</label>
                <input type="text" id="rg" required>
            </div>
            <div class="campo">
                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" required>
            </div>
            <div class="campo">
                <label for="rua">Rua:</label>
                <input type="text" id="rua" required>
            </div>
            <div class="campo">
                <label for="bairro">Bairro:</label>
                <input type="text" id="bairro" required>
            </div>
            <div class="campo">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" required>
            </div>
            <div class="campo">
                <label for="estado">Estado:</label>
                <input type="text" id="estado" required>
            </div>
            <div class="botoes">
                <button type="submit">Cadastrar</button>
            </div>
        </form>
        <div id="mensagem" class="mensagem"></div>
    </main>
    <script src="/post/post.js"></script>
</body>
</html>
